        function getNotePitchShiftSemitones(note) {
            const coarse = typeof note.pitchOffset === 'number' ? note.pitchOffset : 0;
            const cents = typeof note.pitchCents === 'number' ? note.pitchCents : 0;
            return coarse + cents / 100;
        }

        /** Resolve sample pitch algorithm: per-note override or global sidebar. */
        function resolvePitchMethod(note) {
            if (note && (note.pitchMethod === 'psola' || note.pitchMethod === 'world' || note.pitchMethod === 'rate' || note.pitchMethod === 'formant-pitch')) {
                return note.pitchMethod;
            }
            return samplePitchMethod || 'psola';
        }

        // Application State
        const state = {
            notes: [
                { id: 1, startTick: 0, pitch: 60, durationTicks: 4, lyric: 'さ', volume: 1, vibrato: -1, reverb: -1, pitchOffset: 0, pitchCents: 0, pitchMethod: '' },
                { id: 2, startTick: 4, pitch: 62, durationTicks: 4, lyric: 'ー', volume: 1, vibrato: -1, reverb: -1, pitchOffset: 0, pitchCents: 0, pitchMethod: '' },
                { id: 3, startTick: 8, pitch: 64, durationTicks: 4, lyric: 'い', volume: 1, vibrato: -1, reverb: -1, pitchOffset: 0, pitchCents: 0, pitchMethod: '' },
                { id: 4, startTick: 12, pitch: 65, durationTicks: 4, lyric: 'た', volume: 1, vibrato: -1, reverb: -1, pitchOffset: 0, pitchCents: 0, pitchMethod: '' }
            ],
            bpm: 120,
            isPlaying: false,
            currentTick: 0,
            playbackStartTick: 0,
            playbackStartTime: 0,
            totalTicks: 64,
            selectedNoteForModal: null,
            moveModeNoteId: null,
            selectedNoteIds: new Set(),
            clipboard: [],
            audioTrackBuffer: null,
            audioTrackName: '',
            audioTrackSource: null,
            audioTrackGain: null,
            detectedBpm: null,
            // Undo / Redo
            history: [],
            historyIndex: -1,
            maxHistory: 50,
            historyLocked: false
        };

        function cloneNotes(notes) {
            return notes.map(n => ({ ...n }));
        }

        function pushHistory() {
            if (state.historyLocked) return;
            // Drop redo branch
            if (state.historyIndex < state.history.length - 1) {
                state.history = state.history.slice(0, state.historyIndex + 1);
            }
            state.history.push(cloneNotes(state.notes));
            if (state.history.length > state.maxHistory) {
                state.history.shift();
            } else {
                state.historyIndex++;
            }
            // Clamp index after shift
            state.historyIndex = Math.min(state.historyIndex, state.history.length - 1);
            updateUndoRedoButtons();
        }

        function undo() {
            if (state.historyIndex <= 0) return;
            state.historyLocked = true;
            state.historyIndex--;
            state.notes = cloneNotes(state.history[state.historyIndex]);
            markNotesDirty();
            state.selectedNoteIds.clear();
            closeNoteModal();
            requestDraw();
            state.historyLocked = false;
            updateUndoRedoButtons();
        }

        function redo() {
            if (state.historyIndex >= state.history.length - 1) return;
            state.historyLocked = true;
            state.historyIndex++;
            state.notes = cloneNotes(state.history[state.historyIndex]);
            markNotesDirty();
            state.selectedNoteIds.clear();
            closeNoteModal();
            requestDraw();
            state.historyLocked = false;
            updateUndoRedoButtons();
        }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById('btn-undo');
            const redoBtn = document.getElementById('btn-redo');
            if (undoBtn) undoBtn.disabled = state.historyIndex <= 0;
            if (redoBtn) redoBtn.disabled = state.historyIndex >= state.history.length - 1 || state.history.length === 0;
        }

        function extractLyrics() {
            ensureNotesSorted();
            const lines = state.notes.map(n => n.lyric || '');
            const continuous = lines.join(' ');
            return { continuous, lines };
        }

        function showLyricModal() {
            const { continuous, lines } = extractLyrics();
            const contEl = document.getElementById('lyric-text-continuous');
            const linesEl = document.getElementById('lyric-text-lines');
            if (contEl) contEl.value = continuous;
            if (linesEl) linesEl.value = lines.join('\n');
            const modal = document.getElementById('lyric-modal');
            if (modal) modal.classList.remove('hidden');
        }

        function hideLyricModal() {
            const modal = document.getElementById('lyric-modal');
            if (modal) modal.classList.add('hidden');
        }

        // --- Performance helpers (for 200+ notes; viewport-sized canvas) ---
        let notesSortedDirty = true;
        let drawScheduled = false;

        function ensureNotesSorted() {
            if (!notesSortedDirty) return;
            state.notes.sort((a, b) => a.startTick - b.startTick || a.pitch - b.pitch || a.id - b.id);
            notesSortedDirty = false;
        }

        function markNotesDirty() {
            notesSortedDirty = true;
        }

        function requestDraw() {
            if (drawScheduled) return;
            drawScheduled = true;
            requestAnimationFrame(() => {
                drawScheduled = false;
                drawGrid();
                drawRuler();
            });
        }

        function updateBarCountBadge() {
            const badge = document.getElementById('bar-count-badge');
            if (badge) {
                const bars = Math.ceil(state.totalTicks / 4);
                badge.innerText = `${bars}`;
            }
        }

        function addMeasures(addBars = 8) {
            state.totalTicks += addBars * 4;
            updateBarCountBadge();
            resizeCanvases();
        }

        function ensureTickInBounds(tick) {
            if (tick >= state.totalTicks) {
                const neededBars = Math.ceil((tick - state.totalTicks + 8) / 4);
                const expandBars = Math.max(8, Math.ceil(neededBars / 8) * 8);
                state.totalTicks += expandBars * 4;
                updateBarCountBadge();
                resizeCanvases();
            }
        }

        // Web Audio API Beat/BPM Detection Algorithm
        async function analyzeAudioBpm(audioBuffer) {
            const rawData = audioBuffer.getChannelData(0);
            const sampleRate = audioBuffer.sampleRate;
            
            const step = Math.floor(sampleRate / 100);
            const energies = [];
            for (let i = 0; i < rawData.length; i += step) {
                let sum = 0;
                for (let j = 0; j < step && (i + j) < rawData.length; j++) {
                    sum += Math.abs(rawData[i + j]);
                }
                energies.push(sum / step);
            }

            const peaks = [];
            const threshold = 0.22;
            for (let i = 1; i < energies.length - 1; i++) {
                if (energies[i] > threshold && energies[i] > energies[i - 1] && energies[i] > energies[i + 1]) {
                    peaks.push(i * 10);
                }
            }

            const intervals = [];
            for (let i = 0; i < peaks.length - 1; i++) {
                for (let j = i + 1; j < Math.min(i + 8, peaks.length); j++) {
                    const diff = peaks[j] - peaks[i];
                    if (diff >= 300 && diff <= 1000) {
                        intervals.push(diff);
                    }
                }
            }

            if (intervals.length === 0) return 120;

            const counts = {};
            intervals.forEach(intVal => {
                const rounded = Math.round(intVal / 10) * 10;
                counts[rounded] = (counts[rounded] || 0) + 1;
            });

            let topInterval = 500;
            let maxCount = 0;
            Object.keys(counts).forEach(k => {
                if (counts[k] > maxCount) {
                    maxCount = counts[k];
                    topInterval = parseInt(k);
                }
            });

            const calculatedBpm = Math.round(60000 / topInterval);
            return Math.min(200, Math.max(60, calculatedBpm));
        }

        const MIN_MIDI = 36;
        const MAX_MIDI = 84;
        const KEY_HEIGHT = 28;
        const GRID_STEP_PX = 22;

        let gridCanvas, gridCtx, rulerCanvas, rulerCtx, pianoKeysContainer;

        function initPianoKeys() {
            if (!pianoKeysContainer) return;
            pianoKeysContainer.innerHTML = '';
            const border = getCssVar('--border', '#e2e8f0');
            for (let m = MAX_MIDI; m >= MIN_MIDI; m--) {
                const key = document.createElement('div');
                const isBlack = [1, 3, 6, 8, 10].includes(m % 12);
                key.style.height = `${KEY_HEIGHT}px`;
                key.style.borderBottom = `1px solid ${border}`;
                key.style.display = 'flex';
                key.style.alignItems = 'center';
                key.style.justifyContent = 'flex-end';
                key.style.paddingRight = '8px';
                key.style.fontSize = '10px';
                key.style.fontFamily = 'ui-monospace, monospace';
                key.style.userSelect = 'none';
                if (isBlack) {
                    key.style.background = getCssVar('--piano-black', '#0f172a');
                    key.style.color = getCssVar('--piano-black-text', '#e2e8f0');
                    key.style.fontWeight = '500';
                } else {
                    key.style.background = getCssVar('--piano-white', '#ffffff');
                    key.style.color = getCssVar('--piano-white-text', '#334155');
                    key.style.fontWeight = '600';
                }
                if (m % 12 === 0) {
                    key.innerText = `C${(m / 12) - 1}`;
                }
                pianoKeysContainer.appendChild(key);
            }
        }

        function resizeCanvases() {
            if (!gridCanvas || !rulerCanvas) return;
            const numKeys = (MAX_MIDI - MIN_MIDI) + 1;
            const totalWidth = state.totalTicks * GRID_STEP_PX + 200;
            const totalHeight = numKeys * KEY_HEIGHT;
            const wrapper = document.getElementById('grid-scroll-wrapper');
            if (!wrapper) return;

            // The spacer provides the full scrollable timeline. The actual grid
            // bitmap stays viewport-sized instead of allocating totalWidth*totalHeight.
            let spacer = document.getElementById('grid-scroll-spacer');
            if (!spacer) {
                spacer = document.createElement('div');
                spacer.id = 'grid-scroll-spacer';
                spacer.setAttribute('aria-hidden', 'true');
                gridCanvas.insertAdjacentElement('afterend', spacer);
            }
            spacer.style.width = `${totalWidth}px`;
            spacer.style.height = `${totalHeight}px`;
            spacer.style.pointerEvents = 'none';

            const viewWidth = Math.max(1, wrapper.clientWidth);
            const viewHeight = Math.max(1, wrapper.clientHeight - 32);
            gridCanvas.width = viewWidth;
            gridCanvas.height = viewHeight;
            gridCanvas.style.width = `${viewWidth}px`;
            gridCanvas.style.height = `${viewHeight}px`;
            gridCanvas.style.position = 'sticky';
            gridCanvas.style.top = '32px';
            gridCanvas.style.left = '0px';
            gridCanvas.style.zIndex = '5';
            // Keep the viewport canvas over the spacer without adding its height
            // to the scrollable document height.
            gridCanvas.style.marginBottom = `-${viewHeight}px`;
            gridCanvas.style.display = 'block';

            // The ruler is short, so its wide backing bitmap is comparatively cheap.
            rulerCanvas.width = totalWidth;
            rulerCanvas.height = 32;
            rulerCanvas.style.width = `${totalWidth}px`;
            rulerCanvas.style.height = '32px';

            drawGrid();
            drawRuler();
        }

        function drawRuler() {
            if (!rulerCtx) return;
            const wrapper = document.getElementById('grid-scroll-wrapper');
            const scrollLeft = wrapper ? wrapper.scrollLeft : 0;
            const viewW = wrapper ? wrapper.clientWidth : rulerCanvas.width;
            const leftTick = Math.max(0, Math.floor(scrollLeft / GRID_STEP_PX) - 1);
            const rightTick = Math.min(state.totalTicks, Math.ceil((scrollLeft + viewW) / GRID_STEP_PX) + 1);

            const bgPanel = getCssVar('--bg-panel', '#ffffff');
            const gridBar = getCssVar('--grid-bar', '#cbd5e1');
            const textMuted = getCssVar('--text-muted', '#64748b');
            const accent = getCssVar('--theme-accent', '#06b6d4');

            rulerCtx.clearRect(scrollLeft, 0, viewW, rulerCanvas.height);
            rulerCtx.fillStyle = bgPanel;
            rulerCtx.fillRect(scrollLeft, 0, viewW, rulerCanvas.height);
            rulerCtx.strokeStyle = gridBar;
            rulerCtx.fillStyle = textMuted;
            rulerCtx.font = '500 11px Inter, sans-serif';

            for (let t = leftTick; t <= rightTick; t++) {
                const x = t * GRID_STEP_PX;
                if (t % 4 === 0) {
                    rulerCtx.beginPath();
                    rulerCtx.moveTo(x, 14);
                    rulerCtx.lineTo(x, 32);
                    rulerCtx.stroke();
                    rulerCtx.fillText(`${(t / 4) + 1}`, x + 4, 12);
                } else {
                    rulerCtx.beginPath();
                    rulerCtx.moveTo(x, 22);
                    rulerCtx.lineTo(x, 32);
                    rulerCtx.stroke();
                }
            }

            const px = state.currentTick * GRID_STEP_PX;
            if (px >= scrollLeft - 8 && px <= scrollLeft + viewW + 8) {
                rulerCtx.fillStyle = accent;
                rulerCtx.beginPath();
                rulerCtx.moveTo(px - 6, 0);
                rulerCtx.lineTo(px + 6, 0);
                rulerCtx.lineTo(px, 12);
                rulerCtx.fill();

                rulerCtx.strokeStyle = accent;
                rulerCtx.lineWidth = 2;
                rulerCtx.beginPath();
                rulerCtx.moveTo(px, 12);
                rulerCtx.lineTo(px, 32);
                rulerCtx.stroke();
                rulerCtx.lineWidth = 1;
            }
        }

        function drawGrid() {
            if (!gridCtx || !gridCanvas) return;

            const wrapper = document.getElementById('grid-scroll-wrapper');
            const scrollLeft = wrapper ? wrapper.scrollLeft : 0;
            // The sticky 32px ruler occupies the first part of the scroll content.
            const scrollTop = wrapper ? Math.max(0, wrapper.scrollTop - 32) : 0;
            const viewW = gridCanvas.width;
            const viewH = gridCanvas.height;

            // Clear only the small viewport bitmap, then draw using timeline-space coordinates.
            gridCtx.setTransform(1, 0, 0, 1, 0, 0);
            gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
            gridCtx.setTransform(1, 0, 0, 1, -scrollLeft, -scrollTop);

            // Viewport culling ranges (with margin for smooth scroll)
            const marginPx = 120;
            const visTickStart = Math.max(0, Math.floor((scrollLeft - marginPx) / GRID_STEP_PX));
            const visTickEnd = Math.min(state.totalTicks + 1, Math.ceil((scrollLeft + viewW + marginPx) / GRID_STEP_PX));
            const rowStart = Math.max(0, Math.floor((scrollTop - marginPx) / KEY_HEIGHT));
            const rowEnd = Math.min((MAX_MIDI - MIN_MIDI) + 1, Math.ceil((scrollTop + viewH + marginPx) / KEY_HEIGHT));
            const visPitchMax = MAX_MIDI - rowStart;
            const visPitchMin = MAX_MIDI - (rowEnd - 1);

            const gridWhite = getCssVar('--grid-white', '#ffffff');
            const gridBlack = getCssVar('--grid-black', '#f1f5f9');
            const gridLine = getCssVar('--grid-line', '#e2e8f0');
            const gridBar = getCssVar('--grid-bar', '#cbd5e1');
            const accent = getCssVar('--theme-accent', '#06b6d4');
            const noteSelected = getCssVar('--note-selected', '#38bdf8');
            const noteMulti = getCssVar('--note-multi', '#6366f1');
            const noteMove = getCssVar('--note-move', '#f59e0b');

            // Rows Background — only visible pitch range
            for (let i = rowStart; i < rowEnd; i++) {
                const midi = MAX_MIDI - i;
                const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);
                gridCtx.fillStyle = isBlack ? gridBlack : gridWhite;
                gridCtx.fillRect(scrollLeft, i * KEY_HEIGHT, viewW, KEY_HEIGHT);

                gridCtx.strokeStyle = gridLine;
                gridCtx.beginPath();
                gridCtx.moveTo(scrollLeft, (i + 1) * KEY_HEIGHT);
                gridCtx.lineTo(scrollLeft + viewW, (i + 1) * KEY_HEIGHT);
                gridCtx.stroke();
            }

            // Vertical Time Columns — only visible ticks
            for (let t = visTickStart; t <= visTickEnd; t++) {
                const x = t * GRID_STEP_PX;
                gridCtx.strokeStyle = (t % 4 === 0) ? gridBar : gridLine;
                gridCtx.lineWidth = (t % 4 === 0) ? 1.5 : 1;
                gridCtx.beginPath();
                gridCtx.moveTo(x, rowStart * KEY_HEIGHT);
                gridCtx.lineTo(x, rowEnd * KEY_HEIGHT);
                gridCtx.stroke();
            }

            // Draw Notes — only those overlapping the viewport
            ensureNotesSorted();
            for (let i = 0; i < state.notes.length; i++) {
                const note = state.notes[i];
                if (note.startTick > visTickEnd) break; // sorted by startTick
                if (note.startTick + note.durationTicks < visTickStart) continue;
                if (note.pitch < visPitchMin || note.pitch > visPitchMax) continue;

                const x = note.startTick * GRID_STEP_PX;
                const y = (MAX_MIDI - note.pitch) * KEY_HEIGHT;
                const w = note.durationTicks * GRID_STEP_PX;

                const isMultiSelected = state.selectedNoteIds.has(note.id);
                const isSelected = isMultiSelected || (state.selectedNoteForModal && state.selectedNoteForModal.id === note.id);
                const isMoveMode = state.moveModeNoteId === note.id;

                if (isMoveMode) {
                    gridCtx.fillStyle = noteMove;
                } else if (isMultiSelected) {
                    gridCtx.fillStyle = noteMulti;
                } else if (isSelected) {
                    gridCtx.fillStyle = noteSelected;
                } else {
                    gridCtx.fillStyle = accent;
                }

                gridCtx.beginPath();
                gridCtx.roundRect(x + 1.5, y + 2.5, w - 3, KEY_HEIGHT - 5, 6);
                gridCtx.fill();

                gridCtx.strokeStyle = isMoveMode ? '#b45309' : (isMultiSelected ? '#a5b4fc' : (isSelected ? noteMove : accent));
                gridCtx.lineWidth = (isSelected || isMoveMode || isMultiSelected) ? 2.5 : 1;
                if (isMoveMode) {
                    gridCtx.setLineDash([4, 2]);
                } else {
                    gridCtx.setLineDash([]);
                }
                gridCtx.stroke();
                gridCtx.setLineDash([]);

                // Only draw lyric text if note is reasonably wide
                if (w > 14) {
                    gridCtx.fillStyle = '#ffffff';
                    gridCtx.font = 'bold 12px Inter, sans-serif';
                    gridCtx.textAlign = 'center';
                    gridCtx.textBaseline = 'middle';
                    const label = isMoveMode ? `✥ ${note.lyric}` : note.lyric;
                    gridCtx.fillText(label, x + (w / 2), y + (KEY_HEIGHT / 2));
                }
            }

            if (isBoxSelecting && selectionBox) {
                const sx = Math.min(selectionBox.x1, selectionBox.x2);
                const sy = Math.min(selectionBox.y1, selectionBox.y2);
                const sw = Math.abs(selectionBox.x2 - selectionBox.x1);
                const sh = Math.abs(selectionBox.y2 - selectionBox.y1);

                gridCtx.fillStyle = 'rgba(99, 102, 241, 0.15)';
                gridCtx.strokeStyle = '#6366f1';
                gridCtx.lineWidth = 1.5;
                gridCtx.setLineDash([4, 4]);
                gridCtx.fillRect(sx, sy, sw, sh);
                gridCtx.strokeRect(sx, sy, sw, sh);
                gridCtx.setLineDash([]);
            }

            // Playhead Line
            const px = state.currentTick * GRID_STEP_PX;
            if (px >= scrollLeft - 2 && px <= scrollLeft + viewW + 2) {
                gridCtx.strokeStyle = accent;
                gridCtx.lineWidth = 2;
                gridCtx.beginPath();
                gridCtx.moveTo(px, scrollTop);
                gridCtx.lineTo(px, scrollTop + viewH);
                gridCtx.stroke();
            }
            gridCtx.setTransform(1, 0, 0, 1, 0, 0);
        }

        function getCanvasCoords(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
            const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
            const coords = {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
            // The grid canvas is sticky and viewport-sized, so pointer positions
            // must be converted back to the full timeline coordinate space.
            if (canvas === gridCanvas) {
                const wrapper = document.getElementById('grid-scroll-wrapper');
                if (wrapper) {
                    coords.x += wrapper.scrollLeft;
                    coords.y += Math.max(0, wrapper.scrollTop - 32);
                }
            }
            return coords;
        }

        let activeNote = null;
        let isDragging = false;
        let isResizing = false;
        let isBoxSelecting = false;
        let selectionBox = null;
        let pointerDownStartCoords = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let dragStartPositions = [];
        let touchStartTime = 0;
        let lastTapTime = 0;
        let lastTapNoteId = null;

        function copySelectedNotes() {
            if (state.selectedNoteIds.size === 0 && state.selectedNoteForModal) {
                state.selectedNoteIds.add(state.selectedNoteForModal.id);
            }
            if (state.selectedNoteIds.size === 0) return;

            const selectedNotes = state.notes.filter(n => state.selectedNoteIds.has(n.id));
            if (selectedNotes.length === 0) return;

            const minTick = Math.min(...selectedNotes.map(n => n.startTick));
            state.clipboard = selectedNotes.map(n => ({
                offsetTick: n.startTick - minTick,
                pitch: n.pitch,
                durationTicks: n.durationTicks,
                lyric: n.lyric,
                volume: n.volume ?? 1,
                vibrato: n.vibrato ?? -1,
                reverb: n.reverb ?? -1,
                pitchOffset: n.pitchOffset ?? 0,
                pitchCents: n.pitchCents ?? 0,
                pitchMethod: n.pitchMethod || ''
            }));
        }

        function pasteNotes() {
            if (!state.clipboard || state.clipboard.length === 0) return;

            const targetTick = Math.floor(state.currentTick);
            state.selectedNoteIds.clear();

            const newNotes = state.clipboard.map(item => {
                const startTick = Math.max(0, targetTick + item.offsetTick);
                ensureTickInBounds(startTick + item.durationTicks);
                const newNote = {
                    id: Date.now() + Math.floor(Math.random() * 100000),
                    startTick: startTick,
                    pitch: item.pitch,
                    durationTicks: item.durationTicks,
                    lyric: item.lyric,
                    volume: typeof item.volume === 'number' ? item.volume : 1.0,
                    vibrato: typeof item.vibrato === 'number' ? item.vibrato : -1,
                    reverb: typeof item.reverb === 'number' ? item.reverb : -1,
                    pitchOffset: typeof item.pitchOffset === 'number' ? item.pitchOffset : 0,
                    pitchCents: typeof item.pitchCents === 'number' ? item.pitchCents : 0,
                    pitchMethod: item.pitchMethod || ''
                };
                state.selectedNoteIds.add(newNote.id);
                return newNote;
            });

            state.notes.push(...newNotes);
            markNotesDirty();
            scheduleSamplePreprocess(80);
            if (newNotes.length > 0) {
                pushHistory();
                openNoteModal(newNotes[0]);
            }
            requestDraw();
        }

        function selectAllNotes() {
            state.selectedNoteIds.clear();
            state.notes.forEach(n => state.selectedNoteIds.add(n.id));
            if (state.notes.length > 0) {
                openNoteModal(state.notes[0]);
            }
            requestDraw();
        }

        function deleteSelectedNotes() {
            if (state.selectedNoteIds.size > 0) {
                state.notes = state.notes.filter(n => !state.selectedNoteIds.has(n.id));
                state.selectedNoteIds.clear();
                markNotesDirty();
                pushHistory();
                closeNoteModal();
                requestDraw();
            } else if (state.selectedNoteForModal) {
                state.notes = state.notes.filter(n => n.id !== state.selectedNoteForModal.id);
                markNotesDirty();
                pushHistory();
                closeNoteModal();
                requestDraw();
            }
        }

        function handlePointerDown(coords, isRightClick = false, isShiftPressed = false) {
            const tick = Math.floor(coords.x / GRID_STEP_PX);
            const pitch = MAX_MIDI - Math.floor(coords.y / KEY_HEIGHT);

            if (isRightClick) {
                deleteSelectedNotes();
                return;
            }

            const now = Date.now();

            // Fast hit-test using sorted notes + early exit
            ensureNotesSorted();
            const hitTick = Math.floor(coords.x / GRID_STEP_PX);
            const hitPitch = MAX_MIDI - Math.floor(coords.y / KEY_HEIGHT);
            let foundNote = null;
            const margin = 4;
            for (let i = 0; i < state.notes.length; i++) {
                const n = state.notes[i];
                if (n.startTick > hitTick + 2) break;
                if (n.startTick + n.durationTicks < hitTick - 1) continue;
                if (n.pitch !== hitPitch) continue;
                const nx = n.startTick * GRID_STEP_PX;
                const ny = (MAX_MIDI - n.pitch) * KEY_HEIGHT;
                const nw = n.durationTicks * GRID_STEP_PX;
                if (coords.x >= nx - margin && coords.x <= nx + nw + margin &&
                    coords.y >= ny - margin && coords.y <= ny + KEY_HEIGHT + margin) {
                    foundNote = n;
                    break;
                }
            }

            if (foundNote) {
                if (isShiftPressed) {
                    if (state.selectedNoteIds.has(foundNote.id)) {
                        state.selectedNoteIds.delete(foundNote.id);
                    } else {
                        state.selectedNoteIds.add(foundNote.id);
                    }
                } else if (!state.selectedNoteIds.has(foundNote.id)) {
                    state.selectedNoteIds.clear();
                    state.selectedNoteIds.add(foundNote.id);
                }

                const nx = foundNote.startTick * GRID_STEP_PX;
                const nw = foundNote.durationTicks * GRID_STEP_PX;

                const isDoubleTap = (now - lastTapTime < 350) && (lastTapNoteId === foundNote.id);
                lastTapTime = now;
                lastTapNoteId = foundNote.id;

                if (isDoubleTap) {
                    state.moveModeNoteId = foundNote.id;
                    openNoteModal(foundNote);
                    isDragging = true;
                    activeNote = foundNote;
                    dragOffsetX = coords.x - nx;
                    dragOffsetY = coords.y - ((MAX_MIDI - foundNote.pitch) * KEY_HEIGHT);

                    dragStartPositions = state.notes
                        .filter(n => state.selectedNoteIds.has(n.id))
                        .map(n => ({ id: n.id, startTick: n.startTick, pitch: n.pitch }));

                    const effectiveLyric = getEffectiveLyric(foundNote, state.notes);
                    synth.playNote(foundNote.pitch, 0.2, effectiveLyric, null, foundNote.lyric, {
                        volume: foundNote.volume ?? 1, vibrato: foundNote.vibrato ?? -1,
                        reverb: foundNote.reverb ?? -1, pitchOffset: foundNote.pitchOffset ?? 0,
                        pitchCents: foundNote.pitchCents ?? 0, pitchMethod: foundNote.pitchMethod || ''
                    });
                    requestDraw();
                    return;
                }

                openNoteModal(foundNote);

                if (coords.x >= nx + nw - 12 && coords.x <= nx + nw + 6) {
                    isResizing = true;
                    activeNote = foundNote;
                } else {
                    isDragging = true;
                    activeNote = foundNote;
                    dragOffsetX = coords.x - nx;
                    dragOffsetY = coords.y - ((MAX_MIDI - foundNote.pitch) * KEY_HEIGHT);

                    dragStartPositions = state.notes
                        .filter(n => state.selectedNoteIds.has(n.id))
                        .map(n => ({ id: n.id, startTick: n.startTick, pitch: n.pitch }));

                    const effectiveLyric = getEffectiveLyric(foundNote, state.notes);
                    synth.playNote(foundNote.pitch, 0.2, effectiveLyric, null, foundNote.lyric, {
                        volume: foundNote.volume ?? 1, vibrato: foundNote.vibrato ?? -1,
                        reverb: foundNote.reverb ?? -1, pitchOffset: foundNote.pitchOffset ?? 0,
                        pitchCents: foundNote.pitchCents ?? 0, pitchMethod: foundNote.pitchMethod || ''
                    });
                }
            } else {
                if (!isShiftPressed) {
                    state.selectedNoteIds.clear();
                }

                isBoxSelecting = true;
                pointerDownStartCoords = { x: coords.x, y: coords.y };
                selectionBox = { x1: coords.x, y1: coords.y, x2: coords.x, y2: coords.y };
                closeNoteModal();
                requestDraw();
            }
        }

        function handlePointerMove(coords) {
            if (isBoxSelecting && selectionBox) {
                selectionBox.x2 = coords.x;
                selectionBox.y2 = coords.y;

                const bx1 = Math.min(selectionBox.x1, selectionBox.x2);
                const bx2 = Math.max(selectionBox.x1, selectionBox.x2);
                const by1 = Math.min(selectionBox.y1, selectionBox.y2);
                const by2 = Math.max(selectionBox.y1, selectionBox.y2);

                state.selectedNoteIds.clear();
                ensureNotesSorted();
                const boxTickStart = Math.floor(bx1 / GRID_STEP_PX) - 1;
                const boxTickEnd = Math.ceil(bx2 / GRID_STEP_PX) + 1;
                for (let i = 0; i < state.notes.length; i++) {
                    const n = state.notes[i];
                    if (n.startTick > boxTickEnd) break;
                    if (n.startTick + n.durationTicks < boxTickStart) continue;
                    const nx = n.startTick * GRID_STEP_PX;
                    const ny = (MAX_MIDI - n.pitch) * KEY_HEIGHT;
                    const nw = n.durationTicks * GRID_STEP_PX;
                    const nh = KEY_HEIGHT;
                    if (nx < bx2 && nx + nw > bx1 && ny < by2 && ny + nh > by1) {
                        state.selectedNoteIds.add(n.id);
                    }
                }
                requestDraw();
            } else if (isResizing && activeNote) {
                const currentTick = Math.max(1, Math.round(coords.x / GRID_STEP_PX));
                activeNote.durationTicks = Math.max(1, currentTick - activeNote.startTick);
                ensureTickInBounds(activeNote.startTick + activeNote.durationTicks);
                markNotesDirty();
                requestDraw();
            } else if (isDragging && activeNote) {
                const newStartTick = Math.max(0, Math.floor((coords.x - dragOffsetX) / GRID_STEP_PX));
                const newPitch = Math.min(MAX_MIDI, Math.max(MIN_MIDI, MAX_MIDI - Math.floor((coords.y - dragOffsetY) / KEY_HEIGHT)));

                const tickDelta = newStartTick - activeNote.startTick;
                const pitchDelta = newPitch - activeNote.pitch;

                if (tickDelta !== 0 || pitchDelta !== 0) {
                    if (state.selectedNoteIds.size > 1 && dragStartPositions.length > 0) {
                        const baseStart = dragStartPositions.find(p => p.id === activeNote.id)?.startTick ?? activeNote.startTick;
                        const basePitch = dragStartPositions.find(p => p.id === activeNote.id)?.pitch ?? activeNote.pitch;
                        dragStartPositions.forEach(pos => {
                            const note = state.notes.find(n => n.id === pos.id);
                            if (note) {
                                note.startTick = Math.max(0, pos.startTick + (newStartTick - baseStart));
                                note.pitch = Math.min(MAX_MIDI, Math.max(MIN_MIDI, pos.pitch + (newPitch - basePitch)));
                                ensureTickInBounds(note.startTick + note.durationTicks);
                            }
                        });
                    } else {
                        activeNote.startTick = newStartTick;
                        activeNote.pitch = newPitch;
                        ensureTickInBounds(activeNote.startTick + activeNote.durationTicks);
                    }
                    markNotesDirty();

                    if (pitchDelta !== 0) {
                        const effectiveLyric = getEffectiveLyric(activeNote, state.notes);
                        synth.playNote(newPitch, 0.15, effectiveLyric, null, activeNote.lyric, {
                            volume: activeNote.volume ?? 1, vibrato: activeNote.vibrato ?? -1,
                            reverb: activeNote.reverb ?? -1, pitchOffset: activeNote.pitchOffset ?? 0,
                            pitchCents: activeNote.pitchCents ?? 0, pitchMethod: activeNote.pitchMethod || ''
                        });
                    }
                }
                requestDraw();
            }
        }

        function handlePointerUp() {
            const wasDragging = isDragging || isResizing;
            isDragging = false;
            isResizing = false;
            if (wasDragging) {
                markNotesDirty();
                pushHistory();
                scheduleSamplePreprocess(80);
            }
            if (isBoxSelecting) {
                const dist = pointerDownStartCoords ? Math.hypot(selectionBox.x2 - selectionBox.x1, selectionBox.y2 - selectionBox.y1) : 0;
                
                isBoxSelecting = false;
                const wasStartCoords = pointerDownStartCoords;
                pointerDownStartCoords = null;
                selectionBox = null;

                if (dist < 6 && wasStartCoords) {
                    const tick = Math.floor(wasStartCoords.x / GRID_STEP_PX);
                    const pitch = MAX_MIDI - Math.floor(wasStartCoords.y / KEY_HEIGHT);

                    if (tick >= 0 && tick < state.totalTicks && pitch >= MIN_MIDI && pitch <= MAX_MIDI) {
                        const newNote = {
                            id: Date.now() + Math.floor(Math.random() * 100000),
                            startTick: tick,
                            pitch: pitch,
                            durationTicks: 4,
                            lyric: 'あ',
                            volume: 1.0,
                            vibrato: -1,
                            reverb: -1,
                            pitchOffset: 0,
                            pitchCents: 0,
                            pitchMethod: ''
                        };
                        state.notes.push(newNote);
                        markNotesDirty();
                        scheduleSamplePreprocess(80);
                        pushHistory();
                        state.selectedNoteIds.clear();
                        state.selectedNoteIds.add(newNote.id);
                        openNoteModal(newNote);

                        const effectiveLyric = getEffectiveLyric(newNote, state.notes);
                        synth.playNote(pitch, 0.2, effectiveLyric, null, newNote.lyric, {
                            volume: 1, vibrato: -1, reverb: -1, pitchOffset: 0, pitchCents: 0, pitchMethod: ''
                        });
                    }
                } else if (state.selectedNoteIds.size > 0) {
                    const firstSelected = state.notes.find(n => state.selectedNoteIds.has(n.id));
                    if (firstSelected) openNoteModal(firstSelected);
                }
            }
            activeNote = null;
            dragStartPositions = [];
            requestDraw();
        }

        let noteModal, modalInput, modalDeleteBtn, modalMoveBtn, modalCloseBtn;

        function getNoteName(midi) {
            const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const octave = Math.floor(midi / 12) - 1;
            return names[midi % 12] + octave;
        }

        function openNoteModal(note) {

        // Lightweight, offline phrase-aware expression. This is DSP/heuristics, not a neural AI model.
        function makeNoteParams(note, allNotes, engine = synth) {
            const params = {
                volume: typeof note.volume === 'number' ? note.volume : 1.0,
                vibrato: typeof note.vibrato === 'number' ? note.vibrato : -1,
                reverb: typeof note.reverb === 'number' ? note.reverb : -1,
                pitchOffset: typeof note.pitchOffset === 'number' ? note.pitchOffset : 0,
                pitchCents: typeof note.pitchCents === 'number' ? note.pitchCents : 0,
                pitchMethod: note.pitchMethod || ''
            };
            const doNaturalize = !!engine.params.naturalize && engine.params.naturalizeStrength > 0;
            const strength = doNaturalize ? Math.max(0, Math.min(1, engine.params.naturalizeStrength)) : 0;
            const sorted = allNotes.slice().sort((a, b) => a.startTick - b.startTick);
            const idx = sorted.findIndex(n => n.id === note.id);
            const prev = idx > 0 ? sorted[idx - 1] : null;
            const next = idx >= 0 && idx < sorted.length - 1 ? sorted[idx + 1] : null;
            const phraseStart = !prev || note.startTick - (prev.startTick + prev.durationTicks) > 0.5;
            const phraseEnd = !next || next.startTick - (note.startTick + note.durationTicks) > 0.5;
            const leap = prev ? Math.abs((note.pitch || 60) - (prev.pitch || 60)) : 0;
            let expression = 1;
            if (phraseStart) expression += 0.045;
            if (leap >= 4) expression += 0.025;
            if (phraseEnd) expression -= 0.075;
            if (note.durationTicks >= 8) expression += 0.015;
            if (doNaturalize) {
                params.volume = Math.max(0, params.volume * (1 + (expression - 1) * strength));
                params.naturalize = true;
                params.naturalizeStrength = strength;
            } else {
                params.naturalize = false;
                params.naturalizeStrength = 0;
            }
            params.animeStyle = !!engine.params.animeStyle;
            if (engine.params.animeStyle && prev && Math.abs(note.startTick - (prev.startTick + prev.durationTicks)) <= 0.5) {
                params.glideFromMidi = (prev.pitch || 60) + (prev.pitchOffset || 0) + ((prev.pitchCents || 0) / 100);
            }
            return params;
        }

        let playInterval = null;
        let isPreparingSequence = false;
        let playbackPrepareToken = 0;

        // Finish expensive sample pitch processing before starting the playback clock.
        // This prevents 200+ notes from being scheduled against a start time that
        // has already elapsed while PSOLA is still calculating.
        async function preprocessSampleNotesForPlayback(token) {
            const isCustom = !!synth.voicebanks[synth.mode];
            const isNeko = synth.mode === 'neko';
            if (!isCustom && !isNeko) return;
            ensureNotesSorted();
            const buffers = isCustom ? synth.voicebanks[synth.mode].buffers : synth.sampleBuffers;
            if (!buffers) return;
            const notes = state.notes.filter(n => n.startTick >= state.currentTick);
            for (let i = 0; i < notes.length; i++) {
                if (token !== playbackPrepareToken) return;
                const note = notes[i];
                if (!note.lyric || note.lyric === 'っ') continue;
                const lyric = getEffectiveLyric(note, state.notes);
                const kanaInfo = KANA_MAP[lyric] || { c: '', v: 'あ' };
                const sampleBuf = buffers[lyric] || buffers[kanaInfo.v] || buffers[note.lyric] || Object.values(buffers)[0];
                const method = resolvePitchMethod(note);
                if (!sampleBuf || method === 'rate' || method === 'formant-pitch') continue;
                const effectiveMidi = (Number(note.pitch) || 60) + (Number(note.pitchOffset) || 0) + (Number(note.pitchCents) || 0) / 100;
                try { getPitchedSampleBuffer(synth, synth.mode, lyric, effectiveMidi, sampleBuf, method); } catch (e) {}
                if ((i & 3) === 3) await new Promise(resolve => setTimeout(resolve, 0));
            }
        }

        async function playSequence() {
            if (state.isPlaying || isPreparingSequence) return;
            synth.init();
            isPreparingSequence = true;
            const prepareToken = ++playbackPrepareToken;
            const requestedStartTick = state.currentTick;
            try {
                await preprocessSampleNotesForPlayback(prepareToken);
                if (prepareToken !== playbackPrepareToken) return;
                if (synth.ctx.state === 'suspended') await synth.ctx.resume();
            } catch (e) {
                console.warn('Sample pre-processing failed; playback will continue with available buffers.', e);
            } finally {
                if (prepareToken === playbackPrepareToken) isPreparingSequence = false;
            }
            if (prepareToken !== playbackPrepareToken) return;
            state.currentTick = requestedStartTick;

            state.isPlaying = true;
            document.body.classList.add('is-playing');
            const playBtn = document.getElementById('btn-play');
            if (playBtn) {
                playBtn.style.background = 'linear-gradient(135deg, #f59e0b, #f97316)';
                playBtn.style.boxShadow = '0 4px 16px -4px rgba(245, 158, 11, 0.45)';
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            }

            state.playbackStartTick = state.currentTick;
            // Small lead-in ensures scheduled nodes start in the future.
            state.playbackStartTime = synth.ctx.currentTime + 0.08;

            const secondsPerTick = (60 / state.bpm) / 4;

            if (state.audioTrackBuffer) {
                if (state.audioTrackSource) {
                    try { state.audioTrackSource.stop(); } catch(e){}
                }
                state.audioTrackSource = synth.ctx.createBufferSource();
                state.audioTrackSource.buffer = state.audioTrackBuffer;

                if (!state.audioTrackGain) {
                    state.audioTrackGain = synth.ctx.createGain();
                    const volVal = parseFloat(document.getElementById('param-audio-vol')?.value || 0.7);
                    state.audioTrackGain.gain.value = volVal;
                    state.audioTrackGain.connect(synth.ctx.destination);
                }

                state.audioTrackSource.connect(state.audioTrackGain);
                const startOffsetSec = state.playbackStartTick * secondsPerTick;
                if (startOffsetSec < state.audioTrackBuffer.duration) {
                    state.audioTrackSource.start(state.playbackStartTime, startOffsetSec);
                }
            }

            ensureNotesSorted();
            for (let i = 0; i < state.notes.length; i++) {
                const note = state.notes[i];
                if (note.startTick < state.currentTick) continue;
                const delayTicks = note.startTick - state.currentTick;
                const noteStartTime = state.playbackStartTime + (delayTicks * secondsPerTick);
                const noteDuration = note.durationTicks * secondsPerTick;
                const effectiveLyric = getEffectiveLyric(note, state.notes);
                const noteParams = makeNoteParams(note, state.notes, synth);
                synth.playNote(note.pitch, noteDuration, effectiveLyric, noteStartTime, note.lyric, noteParams);
            }

            function tickLoop() {
                if (!state.isPlaying) return;
                const elapsedSec = synth.ctx.currentTime - state.playbackStartTime;
                const elapsedTicks = elapsedSec / secondsPerTick;
                state.currentTick = state.playbackStartTick + elapsedTicks;

                if (state.currentTick >= state.totalTicks) {
                    stopSequence(true);
                    return;
                }

                // Direct draw during playback for smooth playhead (culling keeps it cheap)
                drawGrid();
                drawRuler();
                playInterval = requestAnimationFrame(tickLoop);
            }
            playInterval = requestAnimationFrame(tickLoop);
        }

        function stopSequence(resetPosition = true) {
            playbackPrepareToken++;
            isPreparingSequence = false;
            state.isPlaying = false;
            if (playInterval) cancelAnimationFrame(playInterval);

            synth.stopAll();

            if (state.audioTrackSource) {
                try { state.audioTrackSource.stop(); } catch(e){}
                state.audioTrackSource = null;
            }

            if (resetPosition) {
                state.currentTick = 0;
            }

            document.body.classList.remove('is-playing');
            const playBtn = document.getElementById('btn-play');
            if (playBtn) {
                playBtn.style.background = '';
                playBtn.style.boxShadow = '';
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }

            requestDraw();
        }

        // Fixed WAV Audio Encoder function
        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1;
            const bitDepth = 16;

            let result;
            if (numChannels === 2) {
                const l = buffer.getChannelData(0);
                const r = buffer.getChannelData(1);
                result = new Float32Array(l.length + r.length);
                for (let i = 0; i < l.length; i++) {
                    result[i * 2] = l[i];
                    result[i * 2 + 1] = r[i];
                }
            } else {
                result = buffer.getChannelData(0);
            }

            const dataLength = result.length * (bitDepth / 8);
            const bufferArray = new ArrayBuffer(44 + dataLength);
            const view = new DataView(bufferArray);

            const writeString = (offset, str) => {
                for (let i = 0; i < str.length; i++) {
                    view.setUint8(offset + i, str.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
            view.setUint16(32, numChannels * (bitDepth / 8), true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, dataLength, true);

            let offset = 44;
            for (let i = 0; i < result.length; i++) {
                const s = Math.max(-1, Math.min(1, result[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                offset += 2;
            }

            return new Blob([bufferArray], { type: 'audio/wav' });
        }

            window.addEventListener('touchcancel', handlePointerUp);

            // Bottom Property Sheet Listeners
            if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeNoteModal);

            if (modalMoveBtn) {
                modalMoveBtn.addEventListener('click', () => {
                    if (state.selectedNoteForModal) {
                        if (state.moveModeNoteId === state.selectedNoteForModal.id) {
                            state.moveModeNoteId = null;
                        } else {
                            state.moveModeNoteId = state.selectedNoteForModal.id;
                        }
                        openNoteModal(state.selectedNoteForModal);
                    }
                });
            }

            if (modalInput) {
                modalInput.addEventListener('input', (e) => {
                    if (state.selectedNoteForModal) {
                        state.selectedNoteForModal.lyric = e.target.value || 'あ';
                        scheduleSamplePreprocess(350);
                        requestDraw();
                    }
                });
                modalInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') closeNoteModal();
                });
            }

            if (modalDeleteBtn) {
                modalDeleteBtn.addEventListener('click', () => {
                    if (state.selectedNoteForModal) {
                        state.notes = state.notes.filter(n => n.id !== state.selectedNoteForModal.id);
                        markNotesDirty();
                        pushHistory();
                        requestDraw();
                    }
                    closeNoteModal();
                });
            }

            // Dark / Light toggle
            const themeToggle = document.getElementById('btn-theme-toggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', toggleDarkMode);
            }

            // Playback controls
            document.getElementById('btn-play').addEventListener('click', () => {
                if (state.isPlaying) {
                    stopSequence(false);
                } else {
                    playSequence();
                }
            });

            document.getElementById('btn-stop').addEventListener('click', () => stopSequence(true));

            document.getElementById('singer-mode').addEventListener('change', async (e) => {
                const newMode = e.target.value;
                const vb = synth.voicebanks[newMode];
                const name = vb ? vb.name : newMode;
                showStudioLoading(`${name} に切り替え中…`);
                // Allow UI to paint the overlay before heavy work
                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                synth.mode = newMode;
                if (vb) {
                    if (vb.themeColor) applyThemeColor(vb.themeColor);
                    if (vb.defaultPitchMethod) {
                        samplePitchMethod = vb.defaultPitchMethod;
                        const sel = document.getElementById('sample-pitch-method');
                        if (sel) sel.value = samplePitchMethod;
                    }
                }
                samplePitchCache.clear();
                scheduleSamplePreprocess(40);
                // Short delay so the preparing screen is visible when switching
                await new Promise(r => setTimeout(r, 450));
                hideStudioLoading();
            });

            // Sample pitch algorithm selector (Neko + custom JSON banks)
            const samplePitchSelect = document.getElementById('sample-pitch-method');
            if (samplePitchSelect) {
                samplePitchMethod = samplePitchSelect.value || 'rate';
                samplePitchSelect.addEventListener('change', (e) => {
                    samplePitchMethod = e.target.value;
                    samplePitchCache.clear();
                    scheduleSamplePreprocess(40);
                });
            }

            // Volume Slider
            document.getElementById('param-volume').addEventListener('input', (e) => {
                const v = parseFloat(e.target.value);
                synth.params.volume = v;
                if (synth.masterGain) synth.masterGain.gain.value = v;
                document.getElementById('val-volume').innerText = `${Math.round(v * 100)}%`;
            });

            // FIXED: Vibrato Slider Event Listener
            document.getElementById('param-vibrato').addEventListener('input', (e) => {
                const v = parseFloat(e.target.value);
                synth.params.vibrato = v;
                document.getElementById('val-vibrato').innerText = `${Math.round(v * 100)}%`;
            });

            const naturalizeToggle = document.getElementById('param-naturalize');
            const naturalizeStrength = document.getElementById('param-naturalize-strength');
            if (naturalizeToggle) naturalizeToggle.addEventListener('change', (e) => {
                synth.params.naturalize = e.target.checked;
            });
            if (naturalizeStrength) naturalizeStrength.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                synth.params.naturalizeStrength = value;
                document.getElementById('val-naturalize-strength').innerText = `${Math.round(value * 100)}%`;
            });

            const animeStyleToggle = document.getElementById('param-anime-style');
            const animeStrength = document.getElementById('param-anime-strength');
            if (animeStyleToggle) animeStyleToggle.addEventListener('change', (e) => {
                synth.params.animeStyle = e.target.checked;
            });
            if (animeStrength) animeStrength.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                synth.params.animeStyleStrength = value;
                document.getElementById('val-anime-strength').innerText = `${Math.round(value * 100)}%`;
            });

            // FIXED: Reverb Slider Event Listener
            document.getElementById('param-reverb').addEventListener('input', (e) => {
                const v = parseFloat(e.target.value);
                synth.params.reverb = v;
                if (synth.dryGain && synth.reverbGain) {
                    synth.dryGain.gain.value = 1.0 - v * 0.5;
                    synth.reverbGain.gain.value = v;
                }
                document.getElementById('val-reverb').innerText = `${Math.round(v * 100)}%`;
            });

            // BPM Slider & Header Input
            const paramBpm = document.getElementById('param-bpm');
            const valBpm = document.getElementById('val-bpm');
            const headerBpmInput = document.getElementById('header-bpm-input');

            const updateBpm = (newBpm) => {
                const bpmVal = Math.min(240, Math.max(40, parseInt(newBpm) || 120));
                state.bpm = bpmVal;
                synth.params.bpm = bpmVal;
                if (paramBpm) paramBpm.value = bpmVal;
                if (valBpm) valBpm.innerText = `${bpmVal}`;
                if (headerBpmInput) headerBpmInput.value = bpmVal;
            };

            if (headerBpmInput) {
                headerBpmInput.addEventListener('change', (e) => updateBpm(e.target.value));
                headerBpmInput.addEventListener('input', (e) => updateBpm(e.target.value));
            }

            if (paramBpm) {
                paramBpm.addEventListener('input', (e) => updateBpm(e.target.value));
            }

            // Save Project JSON
            document.getElementById('btn-save-project').addEventListener('click', () => {
                const projectData = {
                    version: '1.0',
                    bpm: state.bpm,
                    singerMode: synth.mode,
                    volume: synth.params.volume,
                    vibrato: synth.params.vibrato,
                    reverb: synth.params.reverb,
                    naturalize: synth.params.naturalize,
                    naturalizeStrength: synth.params.naturalizeStrength,
                    animeStyle: synth.params.animeStyle,
                    animeStyleStrength: synth.params.animeStyleStrength,
                    notes: state.notes
                };

                const jsonStr = JSON.stringify(projectData, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `vocaloid_project_${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(url);
            });

            // Open Project JSON
            const openInput = document.getElementById('input-open-project');
            document.getElementById('btn-open-project').addEventListener('click', () => {
                openInput.click();
            });

            openInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = JSON.parse(evt.target.result);
                        if (!data || !Array.isArray(data.notes)) {
                            return;
                        }

                        state.notes = data.notes.map(normalizeNote);
                        markNotesDirty();
                        state.history = [cloneNotes(state.notes)];
                        state.historyIndex = 0;
                        updateUndoRedoButtons();

                        let maxTick = 64;
                        state.notes.forEach(n => {
                            if (n.startTick + n.durationTicks > maxTick) {
                                maxTick = n.startTick + n.durationTicks;
                            }
                        });
                        state.totalTicks = Math.max(64, Math.ceil(maxTick / 32) * 32);
                        updateBarCountBadge();

                        if (typeof data.bpm === 'number') {
                            state.bpm = data.bpm;
                            synth.params.bpm = data.bpm;
                            document.getElementById('param-bpm').value = data.bpm;
                            document.getElementById('val-bpm').innerText = `${data.bpm}`;
                        }

                        if (data.singerMode && data.singerMode !== 'formant' && synth.voicebanks[data.singerMode]) {
                            synth.mode = data.singerMode;
                            document.getElementById('singer-mode').value = data.singerMode;
                        } else if (data.singerMode === 'formant') {
                            // Cyber Singer removed — keep current sample bank
                        }

                        if (typeof data.volume === 'number') {
                            synth.params.volume = data.volume;
                            if (synth.masterGain) synth.masterGain.gain.value = data.volume;
                            document.getElementById('param-volume').value = data.volume;
                            document.getElementById('val-volume').innerText = `${Math.round(data.volume * 100)}%`;
                        }

                        if (typeof data.vibrato === 'number') {
                            synth.params.vibrato = data.vibrato;
                            document.getElementById('param-vibrato').value = data.vibrato;
                            document.getElementById('val-vibrato').innerText = `${Math.round(data.vibrato * 100)}%`;
                        }

                        if (typeof data.reverb === 'number') {
                            synth.params.reverb = data.reverb;
                            if (synth.dryGain && synth.reverbGain) {
                                synth.dryGain.gain.value = 1.0 - data.reverb * 0.5;
                                synth.reverbGain.gain.value = data.reverb;
                            }
                            document.getElementById('param-reverb').value = data.reverb;
                            document.getElementById('val-reverb').innerText = `${Math.round(data.reverb * 100)}%`;
                        }

                        if (typeof data.naturalize === 'boolean') {
                            synth.params.naturalize = data.naturalize;
                            document.getElementById('param-naturalize').checked = data.naturalize;
                        }
                        if (typeof data.naturalizeStrength === 'number') {
                            synth.params.naturalizeStrength = data.naturalizeStrength;
                            document.getElementById('param-naturalize-strength').value = data.naturalizeStrength;
                            document.getElementById('val-naturalize-strength').innerText = `${Math.round(data.naturalizeStrength * 100)}%`;
                        }
                        if (typeof data.animeStyle === 'boolean') {
                            synth.params.animeStyle = data.animeStyle;
                            document.getElementById('param-anime-style').checked = data.animeStyle;
                        }
                        if (typeof data.animeStyleStrength === 'number') {
                            synth.params.animeStyleStrength = data.animeStyleStrength;
                            document.getElementById('param-anime-strength').value = data.animeStyleStrength;
                            document.getElementById('val-anime-strength').innerText = `${Math.round(data.animeStyleStrength * 100)}%`;
                        }

                        closeNoteModal();
                        resizeCanvases();
                        e.target.value = '';
                    } catch (err) {}
                };
                reader.readAsText(file);
            });

            document.getElementById('btn-export-wav').addEventListener('click', async () => {
                if (state.notes.length === 0 && !state.audioTrackBuffer) {
                    return;
                }

                const exportBtn = document.getElementById('btn-export-wav');
                const originalText = exportBtn.innerHTML;
                exportBtn.disabled = true;
                exportBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 書き出し中...';

                try {
                    const secondsPerTick = (60 / state.bpm) / 4;

                    let maxTick = 0;
                    state.notes.forEach(n => {
                        if (n.startTick + n.durationTicks > maxTick) {
                            maxTick = n.startTick + n.durationTicks;
                        }
                    });

                    let totalDuration = maxTick * secondsPerTick + 2.0;
                    if (state.audioTrackBuffer) {
                        totalDuration = Math.max(totalDuration, state.audioTrackBuffer.duration + 1.0);
                    }
                    totalDuration = Math.max(totalDuration, 2.0);

                    const sampleRate = 44100;
                    const offlineCtx = new OfflineAudioContext(2, Math.ceil(sampleRate * totalDuration), sampleRate);
                    
                    const offlineSynth = new VocaloidSynthEngine();
                    offlineSynth.ctx = offlineCtx;
                    offlineSynth.isInit = true;
                    offlineSynth.mode = synth.mode;
                    offlineSynth.sampleBuffers = synth.sampleBuffers;
                    offlineSynth.voicebanks = synth.voicebanks;
                    offlineSynth.params = { ...synth.params };

                    offlineSynth.masterGain = offlineCtx.createGain();
                    offlineSynth.masterGain.gain.value = offlineSynth.params.volume;

                    offlineSynth.reverbNode = offlineCtx.createConvolver();
                    offlineSynth.reverbNode.buffer = offlineSynth.createImpulseResponse(1.8, 2.0);

                    offlineSynth.dryGain = offlineCtx.createGain();
                    offlineSynth.reverbGain = offlineCtx.createGain();

                    offlineSynth.dryGain.gain.value = 1.0 - offlineSynth.params.reverb * 0.5;
                    offlineSynth.reverbGain.gain.value = offlineSynth.params.reverb;

                    offlineSynth.masterGain.connect(offlineSynth.dryGain);
                    offlineSynth.dryGain.connect(offlineCtx.destination);

                    offlineSynth.masterGain.connect(offlineSynth.reverbNode);
                    offlineSynth.reverbNode.connect(offlineSynth.reverbGain);
                    offlineSynth.reverbGain.connect(offlineCtx.destination);

                    if (state.audioTrackBuffer) {
                        const trackSource = offlineCtx.createBufferSource();
                        trackSource.buffer = state.audioTrackBuffer;
                        const trackGain = offlineCtx.createGain();
                        const volVal = parseFloat(document.getElementById('param-audio-vol')?.value || 0.7);
                        trackGain.gain.value = volVal;
                        trackSource.connect(trackGain);
                        trackGain.connect(offlineCtx.destination);
                        trackSource.start(0);
                    }

                    state.notes.forEach(note => {
                        const noteStartTime = note.startTick * secondsPerTick;
                        const noteDuration = note.durationTicks * secondsPerTick;
                        const effectiveLyric = getEffectiveLyric(note, state.notes);
                        const noteParams = makeNoteParams(note, state.notes, offlineSynth);
                        offlineSynth.playNote(note.pitch, noteDuration, effectiveLyric, noteStartTime, note.lyric, noteParams);
                    });

                    const renderedBuffer = await offlineCtx.startRendering();
                    const wavBlob = audioBufferToWav(renderedBuffer);

                    // FIXED: Correct element creation and download trigger
                    const url = URL.createObjectURL(wavBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `vocaloid_song_${Date.now()}.wav`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (err) {
                    console.error('WAV export error:', err);
                } finally {
                    exportBtn.disabled = false;
                    exportBtn.innerHTML = originalText;
                }
            });

            // Initialize Canvases and Keyboard
            initPianoKeys();
            resizeCanvases();

            // Load custom voicebanks defined in VOICEBANKS (HTML編集で追加)
            showStudioLoading('スタジオを準備中…');
            synth.init();
            synth.loadVoicebanksFromConfig().then(() => {
                scheduleSamplePreprocess(40);
            }).catch((err) => {
                console.error(err);
                showStudioLoading('音源の読み込みに失敗しました');
                setTimeout(hideStudioLoading, 2000);
            });

            // Seed undo history with initial state
            state.history = [cloneNotes(state.notes)];
            state.historyIndex = 0;
            updateUndoRedoButtons();

            window.addEventListener('resize', resizeCanvases);

            // Redraw on scroll so viewport culling stays correct
            const gridScrollWrapper = document.getElementById('grid-scroll-wrapper');
            if (gridScrollWrapper) {
                let scrollRaf = null;
                gridScrollWrapper.addEventListener('scroll', () => {
                    if (scrollRaf) return;
                    scrollRaf = requestAnimationFrame(() => {
                        scrollRaf = null;
                        drawGrid();
                        drawRuler();
                    });
                }, { passive: true });
            }
        };
    </script>
</body>
</html>
